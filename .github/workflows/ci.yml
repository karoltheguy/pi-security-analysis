name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run extension and script tests
        run: |
          for t in tests/test_*.py; do
            echo "::group::$t"
            python3 "$t"
            echo "::endgroup::"
          done

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          npm-version: 11.16.0
          registry-url: https://registry.npmjs.org
      - name: Stage for publishing
        run: npm stage publish .
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
