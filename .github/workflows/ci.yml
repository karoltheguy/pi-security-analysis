name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run extension and script tests
        run: |
          for t in tests/test_*.py; do
            echo "::group::$t"
            python3 "$t"
            echo "::endgroup::"
          done

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install npm with the stage command
        run: |
          npm install -g npm@11.16.0
          npm --version
          npm stage --help | head -3
      - name: Stage for publishing
        run: |
          # Skip staging if this version is already published, so re-running
          # a tag does not fail with E409 ("Cannot stage previously
          # published version").
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "pi-security-analysis@${VERSION}" version >/dev/null 2>&1; then
            echo "pi-security-analysis@${VERSION} is already published to npm; skipping stage."
          else
            npm stage publish
          fi
